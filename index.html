<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextGoesViral</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans',sans-serif;background:#000;color:white;margin:0;padding:20px;text-align:center}
.container{max-width:500px;margin:auto}
h1{font-size:28px}
textarea{width:100%;height:120px;padding:15px;font-size:18px;border-radius:12px;border:none;box-sizing:border-box}
button{width:100%;background:white;color:black;border:none;padding:14px;font-size:18px;border-radius:12px;margin:20px 0;font-weight:bold;cursor:pointer}
#output{width:100%;min-height:100px;background:#1a1a1a;color:white;padding:15px;font-size:20px;border-radius:12px;box-sizing:border-box;text-align:left;white-space:pre-wrap;word-break:break-all;font-family:'Noto Sans Symbols 2','Segoe UI Symbol',sans-serif;border:1px solid #333}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<h1>TextGoesViral 🚀</h1>
<textarea id="input" placeholder="My name"></textarea>
<button onclick="makeBold()">Bold Banao ✨</button>
<div id="output">XX XXXX</div>
<p style="color:#888;margin-top:15px">Made by susritadey</p>
</div>
<script>
function makeBold(){
 const text=document.getElementById('input').value;
 if(!text){alert('Pehle kuch likho!');return;}
 let bold='';
 for(let char of text){
  let code=char.charCodeAt(0);
  if(code>=65&&code<=90){bold+=String.fromCodePoint(0x1D400+code-65);}
  else if(code>=97&&code<=122){bold+=String.fromCodePoint(0x1D41A+code-97);}
  else{bold+=char;}
 }
 document.getElementById('output').innerText=bold;
}
</script>
</body>
</html>
