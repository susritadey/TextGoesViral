<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextGoesViral</title>
<style>
body{font-family:sans-serif; padding:20px; background:#0a0a0a; color:white}
h2{ text-align:center }
textarea{width:100%; height:120px; padding:15px; border-radius:12px; border:none; font-size:16px; box-sizing:border-box}
button{width:100%; padding:14px; background:white; color:black; border:none; border-radius:12px; font-weight:bold; margin-top:12px; font-size:16px}
.out{background:#1a1a1a; padding:15px; margin-top:20px; border-radius:12px; min-height:60px; border:1px solid #333; word-break:break-all}
small{color:#888; display:block; text-align:center; margin-top:15px}
</style>
</head>
<body>
<h2>TextGoesViral 🚀</h2>
<textarea id="in" placeholder="Yaha apna LinkedIn post likho..."></textarea>
<button onclick="convert()">Bold Banao ✨</button>
<div class="out" id="out">Yaha tumhara stylish text ayega...</div>
<small>Made by susritadey</small>
<script>
function convert(){
  let t = document.getElementById('in').value;
  let bold = t.replace(/[a-zA-Z]/g, c => String.fromCodePoint(c.charCodeAt(0) + (c>='a'? 119743 : 119717)));
  document.getElementById('out').innerText = bold;
}
</script>
</body>
</html>
